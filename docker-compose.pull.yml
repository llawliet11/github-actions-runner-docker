services:
  github-runner:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUNNER_VERSION: ${RUNNER_VERSION:-2.334.0}
    image: ${REGISTRY_URL}/github-runner:${RUNNER_VERSION}
    # Do NOT add `container_name:` here. A fixed name lets Docker restart the
    # SAME container, so an --ephemeral runner re-registers its name over a
    # registration GitHub still believes is busy and then never gets work.
    environment:
      - RUNNER_REPO=${RUNNER_REPO}
      - RUNNER_TOKEN=${RUNNER_TOKEN}
      - NODE_VERSION=${NODE_VERSION}
      - GITHUB_PAT=${GITHUB_PAT}
      - GITHUB_OWNER=${GITHUB_OWNER}
      - GITHUB_REPOSITORY=${GITHUB_REPOSITORY}
      - RUNNER_LABELS=${RUNNER_LABELS:-self-hosted}
      # RUNNER_NAME will be set by the container
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Load-bearing: --ephemeral exits after ONE job, so the restart policy is
    # what brings the next runner up. Safe because start.sh clears the stale
    # .runner/.credentials* state on every start. See docker-compose.yml.
    restart: ${RUNNER_RESTART_POLICY:-unless-stopped}
    deploy:
      mode: replicated
      update_config:
        parallelism: 1
      rollback_config:
        parallelism: 1
      replicas: 1
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    networks:
      - runner-network

networks:
  runner-network:
    driver: bridge

# Specify the Docker registry authentication for pulling the image
x-credentials:
  registry:
    url: ${REGISTRY_URL}
    username: ${REGISTRY_USERNAME}
    password: ${REGISTRY_PASSWORD}
